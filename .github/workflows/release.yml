name: Release
# 'v0.2.0' 같은 태그를 push 하면 .app 을 빌드해 GitHub Releases 에 zip 을 올린다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon(arm64) 러너: 결과물은 M1/M2/M3... 맥용
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 빌드
        run: bash packaging/build_macos.sh
      - name: Release 에 첨부
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TypeGrass-macOS.zip
          generate_release_notes: true
